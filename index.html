<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚘 車務日誌 🚘</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #5D9CEC;
            --header-text: #2C3E50;
            --light-blue: #B2DFFC;
            --bg-color: #F8FBFF;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .container { width: 100%; max-width: 450px; }

        .header-title {
            color: var(--primary-blue);
            font-size: 24px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .expense-banner {
            background-color: var(--light-blue);
            padding: 25px 20px;
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(93, 156, 236, 0.15);
            text-align: center;
            margin-bottom: 20px;
        }
        
        .expense-banner span { 
            font-size: 20px; 
            font-weight: 900; 
            color: var(--header-text);
            display: block;
            margin-bottom: 10px;
        }

        .expense-banner h1 { 
            font-size: 44px; 
            margin: 0; 
            font-weight: 900; 
            color: #FFFFFF; 
            text-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .filter-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .filter-select {
            flex: 1; background: white; border: 2px solid #E0E7FF;
            padding: 10px; border-radius: 15px; color: var(--primary-blue);
            font-size: 17px; font-weight: 800; text-align: center; outline: none;
            cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
            height: 48px;
        }

        .section-label { font-size: 18px; font-weight: 900; color: #777; margin-bottom: 10px; display: block; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        .stats-item {
            background: white;
            padding: 12px 15px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 800;
            color: #555;
            border-left: 5px solid var(--light-blue);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stats-item span:last-child { color: var(--primary-blue); }

        .record-card {
            background: white;
            padding: 15px 18px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .record-info { display: flex; align-items: center; gap: 12px; }
        .record-icon { font-size: 26px; }
        .record-details b { display: block; font-size: 17px; font-weight: 900; color: #333; }
        .record-details small { color: #BBB; font-size: 13px; font-weight: 500; }
        
        .record-right { display: flex; align-items: center; gap: 12px; }
        .record-amount { font-size: 19px; font-weight: 900; color: var(--primary-blue); }
        .delete-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 0; opacity: 0.4; }

        /* 修正後的 + 號按鈕：絕對置中 */
        .floating-add-btn {
            position: fixed; right: 25px; bottom: 30px; width: 70px; height: 70px;
            background-color: var(--primary-blue); color: white; border: none;
            border-radius: 50%; font-size: 38px; font-weight: bold;
            display: flex; justify-content: center; align-items: center; line-height: 1;
            box-shadow: 0 10px 25px rgba(93, 156, 236, 0.5); cursor: pointer; z-index: 99;
            -webkit-tap-highlight-color: transparent;
        }

        /* 彈窗樣式修正 */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(6px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: white; width: 88%; max-width: 360px; padding: 25px; border-radius: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        
        /* 統一輸入框：解決日期跑掉的問題 */
        .input-field { 
            width: 100%; 
            height: 50px; 
            border: 2px solid #F2F4F7; 
            border-radius: 15px; 
            padding: 0 15px; 
            margin-bottom: 15px; 
            font-size: 17px; 
            font-weight: 800; 
            box-sizing: border-box; 
            outline: none; 
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F9FAFB;
            display: block;
        }

        /* 特別針對 iOS 日期文字垂直置中 */
        input[type="date"].input-field {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: normal;
        }
        
        input[type="date"]::-webkit-date-and-time-value {
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #extraNoteGroup { display: none; }

        .modal-footer { display: flex; gap: 12px; margin-top: 10px; }
        .modal-btn { flex: 1; height: 50px; border-radius: 15px; border: none; font-size: 17px; font-weight: 900; cursor: pointer; font-family: 'Noto Sans TC', sans-serif; }
        .cancel-btn { background: #F2F4F7; color: #888; }
        .save-btn { background: var(--light-blue); color: var(--primary-blue); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">☁️ 車務日誌 ☁️</div>
        
        <div class="expense-banner">
            <span id="banner-month">--月總支出</span>
            <h1 id="total-display">$ 0</h1>
        </div>

        <div class="filter-group">
            <select class="filter-select" id="yearFilter" onchange="render()">
                <option value="2026">2026年</option>
                <option value="2027">2027年</option>
                <option value="2028">2028年</option>
                <option value="2029">2029年</option>
                <option value="2030">2030年</option>
            </select>
            <select class="filter-select" id="monthFilter" onchange="render()">
                <option value="01">1月</option><option value="02">2月</option>
                <option value="03">3月</option><option value="04">4月</option>
                <option value="05">5月</option><option value="06">6月</option>
                <option value="07">7月</option><option value="08">8月</option>
                <option value="09">9月</option><option value="10">10月</option>
                <option value="11">11月</option><option value="12">12月</option>
            </select>
        </div>

        <span class="section-label">各項統計</span>
        <div class="stats-grid" id="statsGrid"></div>

        <span class="section-label">支出明細</span>
        <div id="history-list"></div>
    </div>

    <button class="floating-add-btn" onclick="toggleModal(true)"><span>+</span></button>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div style="color:var(--primary-blue); font-weight:900; font-size:22px; text-align:center; margin-bottom:20px;">新增項目</div>
            
            <input type="date" class="input-field" id="datePicker">
            
            <select class="input-field" id="categoryPicker" onchange="checkCategory()">
                <option value="油費" data-icon="⛽">油費 ⛽</option>
                <option value="保養" data-icon="🛠️">保養 🛠️</option>
                <option value="車檢" data-icon="🔍">車檢 🔍</option>
                <option value="保險" data-icon="📝">保險 📝</option>
                <option value="其他" data-icon="✨">其他 ✨</option>
            </select>

            <div id="extraNoteGroup">
                <input type="text" class="input-field" id="noteInput" placeholder="項目說明">
            </div>

            <input type="number" class="input-field" id="amountInput" placeholder="輸入金額" inputmode="numeric">
            
            <div class="modal-footer">
                <button class="modal-btn cancel-btn" onclick="toggleModal(false)">取消</button>
                <button class="modal-btn save-btn" onclick="handleSave()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        let allRecords = [];

        function initDates() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            document.getElementById('yearFilter').value = y >= 2026 && y <= 2030 ? y : "2026";
            document.getElementById('monthFilter').value = m;
            document.getElementById('datePicker').value = `${y}-${m}-${d}`;
        }

        function checkCategory() {
            const cat = document.getElementById('categoryPicker').value;
            const noteGroup = document.getElementById('extraNoteGroup');
            const noteInput = document.getElementById('noteInput');
            
            if (cat !== "油費") {
                noteGroup.style.display = "block";
                const tips = { "保養": "保養內容 (如：換機油)", "車檢": "項目 (如：定檢)", "保險": "險種 (如：強制險)", "其他": "備註內容" };
                noteInput.placeholder = tips[cat] || "項目說明";
            } else {
                noteGroup.style.display = "none";
                noteInput.value = "";
            }
        }

        function toggleModal(show) {
            document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
            if (!show) {
                document.getElementById('extraNoteGroup').style.display = "none";
                document.getElementById('noteInput').value = "";
                document.getElementById('amountInput').value = "";
            }
        }

        function handleSave() {
            const dateVal = document.getElementById('datePicker').value;
            const catSelect = document.getElementById('categoryPicker');
            const noteVal = document.getElementById('noteInput').value;
            const rawAmount = document.getElementById('amountInput').value;
            const amountVal = parseInt(rawAmount);

            if (!amountVal || amountVal <= 0) return alert('請輸入有效金額！');
            
            allRecords.push({
                id: Date.now(),
                year: dateVal.split('-')[0],
                month: dateVal.split('-')[1],
                fullDate: dateVal,
                category: catSelect.value,
                note: (catSelect.value !== "油費" && noteVal) ? noteVal : "",
                icon: catSelect.options[catSelect.selectedIndex].getAttribute('data-icon'),
                amount: amountVal,
                createTime: new Date().getTime()
            });
            
            render();
            toggleModal(false);
        }

        function deleteRecord(id) {
            if(confirm('確定要刪除嗎？')) {
                allRecords = allRecords.filter(r => r.id !== id);
                render();
            }
        }

        function render() {
            const fYear = document.getElementById('yearFilter').value;
            const fMonth = document.getElementById('monthFilter').value;
            
            document.getElementById('banner-month').innerText = `${parseInt(fMonth)}月總支出`;

            const stats = { "油費": 0, "保養": 0, "車檢": 0, "保險": 0, "其他": 0 };
            const icons = { "油費": "⛽", "保養": "🛠️", "車檢": "🔍", "保險": "📝", "其他": "✨" };
            let total = 0;

            const filtered = allRecords.filter(r => r.year === fYear && r.month === fMonth);
            
            filtered.forEach(r => {
                const amt = Number(r.amount) || 0;
                if(stats[r.category] !== undefined) stats[r.category] += amt;
                total += amt;
            });

            document.getElementById('total-display').innerText = `$ ${total.toLocaleString()}`;

            // 更新統計區塊 (確保不會 NaN)
            document.getElementById('statsGrid').innerHTML = Object.entries(stats).map(([name, val]) => `
                <div class="stats-item">
                    <span>${icons[name]} ${name}</span>
                    <span>$${val.toLocaleString()}</span>
                </div>
            `).join('');

            // 更新明細列表
            filtered.sort((a, b) => b.createTime - a.createTime);
            document.getElementById('history-list').innerHTML = filtered.length ? filtered.map(r => `
                <div class="record-card">
                    <div class="record-info">
                        <div class="record-icon">${r.icon}</div>
                        <div class="record-details">
                            <b>${r.category} ${r.note ? `<span style="color:#5D9CEC; font-size:14px;">(${r.note})</span>` : ''}</b>
                            <small>${r.fullDate}</small>
                        </div>
                    </div>
                    <div class="record-right">
                        <div class="record-amount">$ ${r.amount.toLocaleString()}</div>
                        <button class="delete-btn" onclick="deleteRecord(${r.id})">🗑️</button>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center; color:#ccc; font-weight:700; margin-top:30px;">目前無紀錄</p>';
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') toggleModal(false);
        });

        initDates();
        render();
    </script>
</body>
</html>
