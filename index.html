<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚘 車務日誌 🚘</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfxxWWvnMlycR7IlGLo2WnilnqHR6eo4U",
            authDomain: "carrrrr-babd6.firebaseapp.com",
            projectId: "carrrrr-babd6",
            storageBucket: "carrrrr-babd6.firebasestorage.app",
            messagingSenderId: "424493347499",
            appId: "1:424493347499:web:cac54f773570d53352fdee"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        window.handleAuth = async () => {
            if (!currentUser) {
                try { await signInWithPopup(auth, provider); } catch (e) { alert("登入失敗"); }
            } else {
                if(confirm("確定要登出嗎？資料將保留在手機中")) signOut(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const avatar = document.getElementById('user-avatar');
            const nameTxt = document.getElementById('user-name');
            const authBtn = document.getElementById('auth-btn');

            if (user) {
                currentUser = user;
                avatar.src = user.photoURL;
                nameTxt.innerText = user.displayName;
                authBtn.innerText = "登出";
                syncWithCloud(user.uid);
            } else {
                currentUser = null;
                avatar.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                nameTxt.innerText = "訪客模式";
                authBtn.innerText = "登入";
                loadLocalData();
            }
        });

        function loadLocalData() {
            const data = localStorage.getItem('car_logs');
            window.allRecords = data ? JSON.parse(data) : [];
            window.render();
        }

        function saveLocalData() {
            localStorage.setItem('car_logs', JSON.stringify(window.allRecords));
            window.render();
        }

        function syncWithCloud(uid) {
            const q = query(collection(db, "users", uid, "logs"), orderBy("createTime", "desc"));
            onSnapshot(q, (snapshot) => {
                let cloudData = [];
                snapshot.forEach((doc) => {
                    cloudData.push({ docId: doc.id, ...doc.data() });
                });
                if(cloudData.length > 0) {
                    window.allRecords = cloudData;
                    localStorage.setItem('car_logs', JSON.stringify(window.allRecords));
                }
                window.render();
            });
        }

        window.saveRecord = async (data) => {
            window.allRecords.unshift(data);
            saveLocalData();
            if (currentUser) {
                await addDoc(collection(db, "users", currentUser.uid, "logs"), data);
            }
        };

        window.deleteRecordFromApp = async (id, docId) => {
            if(!confirm('確定要刪除嗎？')) return;
            window.allRecords = window.allRecords.filter(r => r.id !== id);
            saveLocalData();
            if (currentUser && docId) {
                await deleteDoc(doc(db, "users", currentUser.uid, "logs", docId));
            }
        };

        window.changeTheme = (color, lightColor) => {
            document.documentElement.style.setProperty('--primary-blue', color);
            document.documentElement.style.setProperty('--light-blue', lightColor);
            localStorage.setItem('user-theme', color);
            localStorage.setItem('user-light-theme', lightColor);
        };
    </script>

    <style>
        :root { --primary-blue: #5D9CEC; --light-blue: #B2DFFC; --header-text: #2C3E50; --bg-color: #F8FBFF; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; transition: 0.3s; }
        .page { padding: 20px 20px 100px 20px; display: none; }
        .page.active { display: block; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .header-title { color: var(--primary-blue); font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 20px; }
        .expense-banner { background-color: var(--light-blue); padding: 25px 20px; border-radius: 30px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .expense-banner span { font-size: 18px; font-weight: 900; color: var(--header-text); display: block; margin-bottom: 5px; }
        .expense-banner h1 { font-size: 44px; margin: 0; font-weight: 900; color: #FFFFFF; }
        .filter-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .filter-select { flex: 1; background: white; border: 2px solid #E0E7FF; padding: 10px; border-radius: 15px; color: var(--primary-blue); font-size: 16px; font-weight: 800; text-align: center; outline: none; height: 48px; }
        .section-label { font-size: 18px; font-weight: 900; color: #777; margin-bottom: 10px; display: block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .stats-item { background: white; padding: 12px 15px; border-radius: 15px; font-size: 14px; font-weight: 800; border-left: 5px solid var(--light-blue); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .stats-item span:last-child { color: var(--primary-blue); }
        .record-card { background: white; padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 1px solid #EEE; z-index: 1000; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #BBB; font-weight: bold; font-size: 12px; cursor: pointer; }
        .tab-item.active { color: var(--primary-blue); }
        .profile-card { background: white; padding: 20px; border-radius: 25px; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .color-dot { width: 35px; height: 35px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .floating-add-btn { position: fixed; right: 25px; bottom: 95px; width: 65px; height: 65px; background-color: var(--primary-blue); color: white; border: none; border-radius: 50%; font-size: 35px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 99; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; width: 85%; max-width: 360px; padding: 25px; border-radius: 25px; }
        .input-field { width: 100%; height: 48px; border: 2px solid #F2F4F7; border-radius: 12px; padding: 0 15px; margin-bottom: 12px; box-sizing: border-box; font-size: 16px; font-weight: 800; font-family: inherit; }
    </style>
</head>
<body>

    <div id="log-page" class="page active">
        <div class="container">
            <div class="header-title">☁️ 車務日誌 ☁️</div>
            <div class="expense-banner">
                <span id="banner-month">--月總支出</span>
                <h1 id="total-display">$ 0</h1>
            </div>
            <div class="filter-group">
                <select class="filter-select" id="yearFilter" onchange="render()"><option value="2026">2026年</option><option value="2027">2027年</option></select>
                <select class="filter-select" id="monthFilter" onchange="render()">
                    <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option><option value="04">4月</option>
                    <option value="05">5月</option><option value="06">6月</option><option value="07">7月</option><option value="08">8月</option>
                    <option value="09">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
            </div>
            <span class="section-label">各項統計</span>
            <div class="stats-grid" id="statsGrid"></div>
            <span class="section-label">支出明細</span>
            <div id="history-list"></div>
        </div>
        <button class="floating-add-btn" onclick="toggleModal(true)">+</button>
    </div>

    <div id="set-page" class="page">
        <div class="container">
            <div class="header-title">⚙️ 設定</div>
            <div class="profile-card">
                <img id="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:50px; border-radius:50%;">
                <div style="flex:1"><b id="user-name">訪客模式</b><br><small style="color:#888">登入可同步雲端資料</small></div>
                <button id="auth-btn" onclick="handleAuth()" style="border:none; background:var(--light-blue); color:var(--primary-blue); padding:8px 15px; border-radius:10px; font-weight:900;">登入</button>
            </div>
            <div class="section-label">主題配色</div>
            <div class="profile-card" style="justify-content: space-around;">
                <div class="color-dot" style="background:#5D9CEC" onclick="changeTheme('#5D9CEC','#B2DFFC')"></div>
                <div class="color-dot" style="background:#FF9AA2" onclick="changeTheme('#FF9AA2','#FFD1D4')"></div>
                <div class="color-dot" style="background:#B5EAD7" onclick="changeTheme('#46C495','#B5EAD7')"></div>
                <div class="color-dot" style="background:#FFDAC1" onclick="changeTheme('#E69A6A','#FFDAC1')"></div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('log', this)"><span style="font-size:22px;">📋</span>日誌</div>
        <div class="tab-item" onclick="switchTab('set', this)"><span style="font-size:22px;">⚙️</span>設定</div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <input type="date" id="datePicker" class="input-field">
            <select id="categoryPicker" class="input-field" onchange="checkCategory()">
                <option value="油費" data-icon="⛽">油費 ⛽</option>
                <option value="保養" data-icon="🛠️">保養 🛠️</option>
                <option value="車檢" data-icon="🔍">車檢 🔍</option>
                <option value="其他" data-icon="✨">其他 ✨</option>
            </select>
            <div id="extraNoteGroup" style="display:none;"><input type="text" id="noteInput" class="input-field" placeholder="備註"></div>
            <input type="number" id="amountInput" class="input-field" placeholder="金額" inputmode="numeric">
            <div style="display:flex; gap:10px;">
                <button style="flex:1; height:48px; border-radius:12px; border:none; background:#EEE; font-weight:900;" onclick="toggleModal(false)">取消</button>
                <button style="flex:1; height:48px; border-radius:12px; border:none; background:var(--light-blue); color:var(--primary-blue); font-weight:900;" onclick="handleSave()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        window.allRecords = [];
        function init() {
            const now = new Date();
            document.getElementById('yearFilter').value = now.getFullYear();
            document.getElementById('monthFilter').value = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('datePicker').valueAsDate = now;
            const sc = localStorage.getItem('user-theme');
            if(sc) changeTheme(sc, localStorage.getItem('user-light-theme'));
            loadLocalData();
        }

        function checkCategory() {
            document.getElementById('extraNoteGroup').style.display = document.getElementById('categoryPicker').value !== "油費" ? "block" : "none";
        }

        function toggleModal(show) { document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none'; }

        function switchTab(tab, el) {
            document.getElementById('log-page').style.display = tab === 'log' ? 'block' : 'none';
            document.getElementById('set-page').style.display = tab === 'set' ? 'block' : 'none';
            document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        async function handleSave() {
            const amt = parseInt(document.getElementById('amountInput').value);
            if(!amt) return alert('請輸入金額！');
            const catSelect = document.getElementById('categoryPicker');
            const date = document.getElementById('datePicker').value;
            const record = {
                id: Date.now(), year: date.split('-')[0], month: date.split('-')[1], fullDate: date,
                category: catSelect.value, note: document.getElementById('noteInput').value || "",
                icon: catSelect.options[catSelect.selectedIndex].getAttribute('data-icon'),
                amount: amt, createTime: Date.now()
            };
            await window.saveRecord(record);
            toggleModal(false);
            document.getElementById('amountInput').value = "";
            document.getElementById('noteInput').value = "";
        }

        window.render = function() {
            const y = document.getElementById('yearFilter').value;
            const m = document.getElementById('monthFilter').value;
            document.getElementById('banner-month').innerText = `${parseInt(m)}月總支出`;
            
            const filtered = (window.allRecords || []).filter(r => r.year === y && r.month === m);
            let total = 0; 
            const stats = { "油費": 0, "保養": 0, "車檢": 0, "其他": 0 };
            const statIcons = { "油費": "⛽", "保養": "🛠️", "車檢": "🔍", "其他": "✨" };
            
            filtered.forEach(r => { total += Number(r.amount); stats[r.category] += Number(r.amount); });
            
            document.getElementById('total-display').innerText = `$ ${total.toLocaleString()}`;
            document.getElementById('statsGrid').innerHTML = Object.entries(stats).map(([n, v]) => `
                <div class="stats-item"><span>${statIcons[n]} ${n}</span><span>$${v.toLocaleString()}</span></div>`).join('');
            
            document.getElementById('history-list').innerHTML = filtered.length ? filtered.map(r => `
                <div class="record-card">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-size:24px;">${r.icon}</span>
                        <div><b>${r.category} ${r.note ? `<small style="color:var(--primary-blue)">(${r.note})</small>` : ''}</b><br><small style="color:#BBB">${r.fullDate}</small></div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:900; color:var(--primary-blue)">$${r.amount.toLocaleString()}</span>
                        <button style="background:none; border:none; opacity:0.2;" onclick="deleteRecordFromApp(${r.id}, '${r.docId||''}')">🗑️</button>
                    </div>
                </div>`).join('') : '<p style="text-align:center; color:#ccc; margin-top:30px;">目前無紀錄</p>';
        };
        init();
    </script>
</body>
</html>
