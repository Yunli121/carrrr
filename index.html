<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚘 車務日誌 🚘</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfxxWWvnMlycR7IlGLo2WnilnqHR6eo4U",
            authDomain: "carrrrr-babd6.firebaseapp.com",
            projectId: "carrrrr-babd6",
            storageBucket: "carrrrr-babd6.firebasestorage.app",
            messagingSenderId: "424493347499",
            appId: "1:424493347499:web:cac54f773570d53352fdee"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        window.handleAuth = async () => {
            if (!currentUser) {
                try { await signInWithPopup(auth, provider); } catch (e) { alert("登入失敗"); }
            } else {
                if(confirm("確定要登出嗎？資料將保留在手機中")) signOut(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const avatar = document.getElementById('user-avatar');
            const nameTxt = document.getElementById('user-name');
            const authBtn = document.getElementById('auth-btn');

            if (user) {
                currentUser = user;
                avatar.src = user.photoURL;
                nameTxt.innerText = user.displayName;
                authBtn.innerText = "登出";
                syncWithCloud(user.uid);
            } else {
                currentUser = null;
                avatar.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                nameTxt.innerText = "訪客模式";
                authBtn.innerText = "登入";
                loadLocalData();
            }
        });

        function loadLocalData() {
            const data = localStorage.getItem('car_logs');
            window.allRecords = data ? JSON.parse(data) : [];
            window.render();
        }

        function saveLocalData() {
            localStorage.setItem('car_logs', JSON.stringify(window.allRecords));
            window.render();
        }

        function syncWithCloud(uid) {
            const q = query(collection(db, "users", uid, "logs"), orderBy("createTime", "desc"));
            onSnapshot(q, (snapshot) => {
                let cloudData = [];
                snapshot.forEach((doc) => {
                    cloudData.push({ docId: doc.id, ...doc.data() });
                });
                if(cloudData.length > 0) {
                    window.allRecords = cloudData;
                    localStorage.setItem('car_logs', JSON.stringify(window.allRecords));
                }
                window.render();
            });
        }

        window.saveRecord = async (data) => {
            window.allRecords.unshift(data);
            saveLocalData();
            if (currentUser) {
                await addDoc(collection(db, "users", currentUser.uid, "logs"), data);
            }
        };

        window.deleteRecordFromApp = async (id, docId) => {
            if(!confirm('確定要刪除嗎？')) return;
            window.allRecords = window.allRecords.filter(r => r.id !== id);
            saveLocalData();
            if (currentUser && docId) {
                await deleteDoc(doc(db, "users", currentUser.uid, "logs", docId));
            }
        };

        window.exportData = () => {
            if (window.allRecords.length === 0) return alert("目前沒有資料可以匯出喔！");
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.allRecords));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `車務日誌備份_${new Date().toLocaleDateString()}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        };

        window.importData = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (confirm("匯入將會取代目前的資料，確定嗎？")) {
                        window.allRecords = imported;
                        saveLocalData();
                        alert("匯入成功！");
                    }
                } catch (err) {
                    alert("檔案格式不正確！");
                }
            };
            reader.readAsText(file);
        };

        window.changeTheme = (color, lightColor) => {
            document.documentElement.style.setProperty('--primary-blue', color);
            document.documentElement.style.setProperty('--light-blue', lightColor);
            localStorage.setItem('user-theme', color);
            localStorage.setItem('user-light-theme', lightColor);
        };
    </script>

    <style>
        :root { 
            --primary-blue: #5D9CEC; 
            --light-blue: #B2DFFC; 
            --header-text: #2C3E50; 
            --bg-color: #F0F5FA; 
        }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--bg-color); 
            /* 圓點點背景圖案 CSS - 放大版 (40px) */
            background-image: radial-gradient(var(--light-blue) 3px, transparent 3px);
            background-size: 40px 40px;
            background-blend-mode: overlay;
            margin: 0; 
            padding: 0; 
            transition: 0.3s; 
            min-height: 100vh;
            -webkit-overflow-scrolling: touch; /* iOS 滾動優化 */
        }
        
        /* 去除所有陰影 */
        * { box-shadow: none !important; -webkit-box-shadow: none !important; }

        .page { padding: 20px 20px 100px 20px; display: none; }
        .page.active { display: block; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; position: relative; z-index: 1; }
        .header-title { color: var(--primary-blue); font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 20px; text-shadow: 0 1px 0px white; }
        
        .expense-banner { 
            background-color: var(--light-blue); 
            padding: 25px 20px; 
            border-radius: 30px; 
            text-align: center; 
            margin-bottom: 20px; 
            border: 3px solid var(--header-text);
        }
        .expense-banner span { font-size: 18px; font-weight: 900; color: var(--header-text); display: block; margin-bottom: 5px; }
        .expense-banner h1 { font-size: 44px; margin: 0; font-weight: 900; color: #FFFFFF; text-shadow: 1px 1px 0px var(--header-text); }
        
        .filter-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .filter-select { flex: 1; background: white; border: 3px solid var(--header-text); padding: 10px; border-radius: 15px; color: var(--header-text); font-size: 16px; font-weight: 800; text-align: center; outline: none; height: 48px; cursor: pointer; font-family: inherit; }
        
        .section-label { font-size: 18px; font-weight: 900; color: var(--header-text); margin: 25px 0 10px 5px; display: block; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .stats-item { background: white; padding: 15px; border-radius: 18px; font-size: 14px; font-weight: 800; border: 3px solid var(--header-text); display: flex; justify-content: space-between; align-items: center; color: var(--header-text); }
        .stats-item span:last-child { color: var(--primary-blue); font-size: 16px; font-weight: 900; }
        
        .record-card { background: white; padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border: 3px solid var(--header-text); }
        
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; border-top: 3px solid var(--header-text); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); box-sizing: content-box; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #BBB; font-weight: bold; font-size: 12px; cursor: pointer; }
        .tab-item.active { color: var(--primary-blue); }
        
        .profile-card { background: white; padding: 20px; border-radius: 25px; display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border: 3px solid var(--header-text); }
        .menu-list { background: white; border-radius: 25px; overflow: hidden; border: 3px solid var(--header-text); margin-bottom: 20px; }
        .menu-item { padding: 18px 20px; border-bottom: 2px solid var(--header-text); display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: var(--header-text); cursor: pointer; }
        .menu-item:last-child { border-bottom: none; }
        
        .color-dot { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--header-text); cursor: pointer; transition: transform 0.1s; }
        .color-dot:active { transform: scale(0.95); }

        .floating-add-btn { position: fixed; right: 25px; bottom: calc(95px + env(safe-area-inset-bottom)); width: 65px; height: 65px; background-color: var(--primary-blue); color: white; border: 3px solid var(--header-text); border-radius: 50%; font-size: 35px; z-index: 99; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; text-decoration: none; -webkit-tap-highlight-color: transparent; }
        .floating-add-btn:active { transform: scale(0.95); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 2000; -webkit-tap-highlight-color: transparent; }
        .modal-content { background: white; width: 85%; max-width: 380px; padding: 25px; border-radius: 25px; border: 4px solid var(--header-text); }
        .modal-content h3 { color:var(--header-text); font-weight:900; font-size:22px; text-align:center; margin: 0 0 20px 0; }

        .input-field { 
            width: 100%; 
            height: 50px; 
            border: 3px solid var(--header-text); 
            border-radius: 12px; 
            padding: 0 15px; 
            margin-bottom: 15px; 
            box-sizing: border-box; 
            font-size: 17px; /* iOS 防止縮放的最安全字號 */
            font-weight: 800; 
            font-family: inherit; 
            color: var(--header-text); 
            background: white;
            -webkit-appearance: none; /* 去除 iOS 預設內陰影 */
        }
        
        /* 針對 iOS 日期欄位跑掉的專用修正 */
        input[type="date"].input-field {
            display: flex;
            align-items: center;
            justify-content: flex-start; /* 文字靠左對齊 */
            padding-right: 10px;
            position: relative;
        }

        /* 修正 iOS 日期文字顯示不完全的問題 */
        input[type="date"]::-webkit-date-and-time-value {
            min-height: 1.5em;
            text-align: left;
            margin-left: 0;
            width: 100%;
        }

        .input-field:focus { border-color: var(--primary-blue); outline: none; }
        
        .modal-footer { display:flex; gap:15px; margin-top:10px; }
        .modal-btn { flex: 1; height: 50px; border-radius: 12px; border: 3px solid var(--header-text); font-weight: 900; font-size: 16px; cursor: pointer; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .modal-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="log-page" class="page active">
        <div class="container">
            <div class="header-title">☁️ 車務日誌 ☁️</div>
            <div class="expense-banner">
                <span id="banner-month">--月總支出</span>
                <h1 id="total-display">$ 0</h1>
            </div>
            <div class="filter-group">
                <select class="filter-select" id="yearFilter" onchange="render()"><option value="2026">2026年</option><option value="2027">2027年</option></select>
                <select class="filter-select" id="monthFilter" onchange="render()">
                    <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option><option value="04">4月</option>
                    <option value="05">5月</option><option value="06">6月</option><option value="07">7月</option><option value="08">8月</option>
                    <option value="09">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
            </div>
            <span class="section-label">各項統計</span>
            <div class="stats-grid" id="statsGrid"></div>
            <span class="section-label">支出明細</span>
            <div id="history-list"></div>
        </div>
        <button class="floating-add-btn" onclick="toggleModal(true)"><span>+</span></button>
    </div>

    <div id="set-page" class="page">
        <div class="container">
            <div class="header-title">⚙️ 設定</div>
            <div class="profile-card">
                <img id="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" style="width:50px; height:50px; border-radius:50%; border: 2px solid var(--header-text);">
                <div style="flex:1"><b id="user-name" style="color:var(--header-text); font-size:18px;">訪客模式</b><br><small style="color:#666">登入可同步雲端資料</small></div>
                <button id="auth-btn" onclick="handleAuth()" style="border:3px solid var(--header-text); background:var(--light-blue); color:var(--header-text); padding:8px 15px; border-radius:10px; font-weight:900; cursor:pointer;">登入</button>
            </div>
            
            <div class="section-label">資料備份 (JSON)</div>
            <div class="menu-list">
                <div class="menu-item" onclick="exportData()">
                    <span>📤 匯出備份檔案</span>
                    <span style="color:var(--primary-blue); font-size: 14px; font-weight: 900;">下載</span>
                </div>
                <label class="menu-item">
                    <span>📥 匯入備份檔案</span>
                    <span style="color:var(--primary-blue); font-size: 14px; font-weight: 900;">選擇檔案</span>
                    <input type="file" accept=".json" style="display:none;" onchange="importData(event)">
                </label>
            </div>

            <div class="section-label">主題配色</div>
            <div class="profile-card" style="justify-content: space-around; padding: 25px;">
                <div class="color-dot" style="background:#5D9CEC" onclick="changeTheme('#5D9CEC','#B2DFFC')"></div>
                <div class="color-dot" style="background:#FF9AA2" onclick="changeTheme('#FF9AA2','#FFD1D4')"></div>
                <div class="color-dot" style="background:#B5EAD7" onclick="changeTheme('#46C495','#B5EAD7')"></div>
                <div class="color-dot" style="background:#FFDAC1" onclick="changeTheme('#E69A6A','#FFDAC1')"></div>
            </div>
            <div style="text-align: center; color: var(--header-text); opacity: 0.5; font-size: 12px; margin-top: 30px; font-weight: bold;">v1.0.5 · 大點點清爽版</div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('log', this)"><span style="font-size:24px; margin-bottom:3px;">📋</span>日誌</div>
        <div class="tab-item" onclick="switchTab('set', this)"><span style="font-size:24px; margin-bottom:3px;">⚙️</span>設定</div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h3>新增項目</h3>
            <input type="date" id="datePicker" class="input-field">
            <select id="categoryPicker" class="input-field" onchange="checkCategory()">
                <option value="油費" data-icon="⛽">油費 ⛽</option>
                <option value="保養" data-icon="🛠️">保養 🛠️</option>
                <option value="車檢" data-icon="🔍">車檢 🔍</option>
                <option value="其他" data-icon="✨">其他 ✨</option>
            </select>
            <div id="extraNoteGroup" style="display:none;"><input type="text" id="noteInput" class="input-field" placeholder="備註 (保養內容/項目說明)"></div>
            <input type="number" id="amountInput" class="input-field" placeholder="金額 (數字)" inputmode="numeric">
            <div class="modal-footer">
                <button class="modal-btn" style="background:#EEE; color:#555;" onclick="toggleModal(false)">取消</button>
                <button class="modal-btn" style="background:var(--light-blue); color:var(--header-text);" onclick="handleSave()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        window.allRecords = [];
        function init() {
            const now = new Date();
            document.getElementById('yearFilter').value = now.getFullYear();
            document.getElementById('monthFilter').value = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('datePicker').valueAsDate = now;
            const sc = localStorage.getItem('user-theme');
            if(sc) changeTheme(sc, localStorage.getItem('user-light-theme'));
            loadLocalData();
        }

        function checkCategory() {
            document.getElementById('extraNoteGroup').style.display = document.getElementById('categoryPicker').value !== "油費" ? "block" : "none";
        }

        function toggleModal(show) { document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none'; }

        function switchTab(tab, el) {
            document.getElementById('log-page').style.display = tab === 'log' ? 'block' : 'none';
            document.getElementById('set-page').style.display = tab === 'set' ? 'block' : 'none';
            document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        async function handleSave() {
            const amt = parseInt(document.getElementById('amountInput').value);
            if(!amt) return alert('請輸入金額！');
            const catSelect = document.getElementById('categoryPicker');
            const date = document.getElementById('datePicker').value;
            const record = {
                id: Date.now(), year: date.split('-')[0], month: date.split('-')[1], fullDate: date,
                category: catSelect.value, note: document.getElementById('noteInput').value || "",
                icon: catSelect.options[catSelect.selectedIndex].getAttribute('data-icon'),
                amount: amt, createTime: Date.now()
            };
            await window.saveRecord(record);
            toggleModal(false);
            document.getElementById('amountInput').value = "";
            document.getElementById('noteInput').value = "";
        }

        window.render = function() {
            const y = document.getElementById('yearFilter').value;
            const m = document.getElementById('monthFilter').value;
            document.getElementById('banner-month').innerText = `${parseInt(m)}月總支出`;
            
            const filtered = (window.allRecords || []).filter(r => r.year === y && r.month === m);
            let total = 0; 
            const stats = { "油費": 0, "保養": 0, "車檢": 0, "其他": 0 };
            const statIcons = { "油費": "⛽", "保養": "🛠️", "車檢": "🔍", "其他": "✨" };
            
            filtered.forEach(r => { total += Number(r.amount); stats[r.category] += Number(r.amount); });
            
            document.getElementById('total-display').innerText = `$ ${total.toLocaleString()}`;
            document.getElementById('statsGrid').innerHTML = Object.entries(stats).map(([n, v]) => `
                <div class="stats-item"><span>${statIcons[n]} ${n}</span><span>$${v.toLocaleString()}</span></div>`).join('');
            
            document.getElementById('history-list').innerHTML = filtered.length ? filtered.map(r => `
                <div class="record-card">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="font-size:28px;">${r.icon}</span>
                        <div><b style="color:var(--header-text); font-size:17px;">${r.category} ${r.note ? `<small style="color:var(--primary-blue); font-weight:700;">(${r.note})</small>` : ''}</b><br><small style="color:#999; font-weight:500;">${r.fullDate}</small></div>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span style="font-weight:900; color:var(--primary-blue); font-size:18px;">$${r.amount.toLocaleString()}</span>
                        <button style="background:none; border:none; opacity:0.3; cursor:pointer; font-size:18px;" onclick="deleteRecordFromApp(${r.id}, '${r.docId||''}')">🗑️</button>
                    </div>
                </div>`).join('') : '<p style="text-align:center; color:#AAA; margin-top:40px; font-weight:bold;">目前無紀錄</p>';
        };
        init();
    </script>
</body>
</html>
