<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚘 車務日誌 🚘</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfxxWWvnMlycR7IlGLo2WnilnqHR6eo4U",
            authDomain: "carrrrr-babd6.firebaseapp.com",
            projectId: "carrrrr-babd6",
            storageBucket: "carrrrr-babd6.firebasestorage.app",
            messagingSenderId: "424493347499",
            appId: "1:424493347499:web:cac54f773570d53352fdee"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        window.handleAuth = async () => {
            if (!currentUser) {
                try { await signInWithPopup(auth, provider); } catch (e) { alert("登入失敗"); }
            } else {
                if(confirm("確定要登出嗎？")) signOut(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            const avatar = document.getElementById('user-avatar');
            const nameTxt = document.getElementById('user-name');
            const syncTxt = document.getElementById('sync-text');
            const authBtn = document.getElementById('auth-btn');

            if (user) {
                currentUser = user;
                avatar.src = user.photoURL;
                nameTxt.innerText = user.displayName;
                syncTxt.innerText = "雲端資料同步中 ☁️";
                authBtn.innerText = "登出帳號";
                loadCloudData(user.uid);
            } else {
                currentUser = null;
                avatar.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
                nameTxt.innerText = "訪客模式";
                syncTxt.innerText = "登入後即可同步雲端";
                authBtn.innerText = "Google 登入";
                document.getElementById('history-list').innerHTML = '<p style="text-align:center; color:#ccc; margin-top:30px;">請先登入以同步雲端資料</p>';
                document.getElementById('total-display').innerText = "$ 0";
                document.getElementById('statsGrid').innerHTML = ""; // 清空統計
                window.allRecords = []; 
            }
        });

        function loadCloudData(uid) {
            const q = query(collection(db, "users", uid, "logs"), orderBy("createTime", "desc"));
            onSnapshot(q, (snapshot) => {
                window.allRecords = [];
                snapshot.forEach((doc) => {
                    window.allRecords.push({ docId: doc.id, ...doc.data() });
                });
                window.render(); // 重要：抓到雲端資料後立刻重新渲染畫面
            });
        }

        window.saveToCloud = async (data) => {
            if (!currentUser) return alert("請先登入帳號！");
            await addDoc(collection(db, "users", currentUser.uid, "logs"), data);
        };

        window.deleteFromCloud = async (docId) => {
            if (!currentUser) return;
            await deleteDoc(doc(db, "users", currentUser.uid, "logs", docId));
        };

        window.switchTab = (tab, el) => {
            document.getElementById('log-page').style.display = tab === 'log' ? 'block' : 'none';
            document.getElementById('set-page').style.display = tab === 'set' ? 'block' : 'none';
            document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            if(tab === 'log') window.render(); // 切換回來時確保統計有刷新
        };
    </script>

    <style>
        :root { --primary-blue: #5D9CEC; --header-text: #2C3E50; --light-blue: #B2DFFC; --bg-color: #F8FBFF; }
        body { font-family: 'Noto Sans TC', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: #333; }
        .page { padding: 20px 20px 100px 20px; display: none; }
        .page.active { display: block; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }
        .header-title { color: var(--primary-blue); font-size: 24px; font-weight: 900; text-align: center; margin-bottom: 20px; }
        .expense-banner { background-color: var(--light-blue); padding: 25px 20px; border-radius: 30px; box-shadow: 0 10px 20px rgba(93, 156, 236, 0.15); text-align: center; margin-bottom: 20px; }
        .expense-banner span { font-size: 20px; font-weight: 900; color: var(--header-text); display: block; margin-bottom: 10px; }
        .expense-banner h1 { font-size: 44px; margin: 0; font-weight: 900; color: #FFFFFF; text-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .filter-group { display: flex; gap: 12px; margin-bottom: 20px; }
        .filter-select { flex: 1; background: white; border: 2px solid #E0E7FF; padding: 10px; border-radius: 15px; color: var(--primary-blue); font-size: 17px; font-weight: 800; text-align: center; outline: none; height: 48px; }
        .section-label { font-size: 18px; font-weight: 900; color: #777; margin-bottom: 10px; display: block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .stats-item { background: white; padding: 12px 15px; border-radius: 15px; font-size: 14px; font-weight: 800; color: #555; border-left: 5px solid var(--light-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center; }
        .stats-item span:last-child { color: var(--primary-blue); }
        .record-card { background: white; padding: 15px 18px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .record-info { display: flex; align-items: center; gap: 12px; }
        .record-icon { font-size: 26px; }
        .record-details b { display: block; font-size: 17px; font-weight: 900; color: #333; }
        .record-details small { color: #BBB; font-size: 13px; font-weight: 500; }
        .record-right { display: flex; align-items: center; gap: 12px; }
        .record-amount { font-size: 19px; font-weight: 900; color: var(--primary-blue); }
        .delete-btn { background: none; border: none; font-size: 20px; cursor: pointer; opacity: 0.4; }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 75px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #EEE; z-index: 1000; }
        .tab-item { display: flex; flex-direction: column; align-items: center; color: #BBB; font-size: 12px; font-weight: bold; cursor: pointer; flex: 1; height: 100%; justify-content: center; }
        .tab-item.active { color: var(--primary-blue); }
        .tab-icon { font-size: 24px; margin-bottom: 4px; }
        .profile-card { background: white; padding: 20px; border-radius: 25px; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .user-avatar { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--light-blue); }
        .menu-list { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .menu-item { padding: 18px 20px; border-bottom: 1px solid #F5F5F5; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(6px); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; width: 88%; max-width: 360px; padding: 25px; border-radius: 30px; }
        .input-field { width: 100%; height: 50px; border: 2px solid #F2F4F7; border-radius: 15px; padding: 0 15px; margin-bottom: 15px; font-size: 17px; font-weight: 800; box-sizing: border-box; outline: none; background-color: #F9FAFB; font-family: inherit; }
        .floating-add-btn { position: fixed; right: 25px; bottom: 95px; width: 65px; height: 65px; background-color: var(--primary-blue); color: white; border: none; border-radius: 50%; font-size: 35px; box-shadow: 0 10px 25px rgba(93, 156, 236, 0.4); z-index: 99; }
    </style>
</head>
<body>

    <div id="log-page" class="page active">
        <div class="container">
            <div class="header-title">☁️ 車務日誌 ☁️</div>
            <div class="expense-banner">
                <span id="banner-month">--月總支出</span>
                <h1 id="total-display">$ 0</h1>
            </div>
            <div class="filter-group">
                <select class="filter-select" id="yearFilter" onchange="render()"><option value="2026">2026年</option><option value="2027">2027年</option></select>
                <select class="filter-select" id="monthFilter" onchange="render()">
                    <option value="01">1月</option><option value="02">2月</option><option value="03">3月</option><option value="04">4月</option>
                    <option value="05">5月</option><option value="06">6月</option><option value="07">7月</option><option value="08">8月</option>
                    <option value="09">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
            </div>
            <span class="section-label">各項統計</span>
            <div class="stats-grid" id="statsGrid"></div>
            <span class="section-label">支出明細</span>
            <div id="history-list"></div>
        </div>
        <button class="floating-add-btn" onclick="toggleModal(true)">+</button>
    </div>

    <div id="set-page" class="page">
        <div class="container">
            <div class="header-title">⚙️ 系統設定</div>
            <div class="profile-card">
                <img id="user-avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="user-avatar">
                <div style="flex:1">
                    <div id="user-name" style="font-weight:900; font-size:20px;">訪客模式</div>
                    <div id="sync-text" style="font-size:13px; color:#888;">登入後即可同步雲端</div>
                </div>
                <button id="auth-btn" style="background:var(--light-blue); color:var(--primary-blue); border:none; padding:8px 15px; border-radius:12px; font-weight:900;" onclick="handleAuth()">登入</button>
            </div>
            <div class="menu-list">
                <div class="menu-item"><span>🎨 主題配色</span><span style="color:var(--primary-blue)">奶藍色</span></div>
                <div class="menu-item"><span>ℹ️ 版本說明</span><span style="color:#CCC">v1.0.2</span></div>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab('log', this)">
            <span class="tab-icon">📋</span><div>車務清單</div>
        </div>
        <div class="tab-item" onclick="switchTab('set', this)">
            <span class="tab-icon">⚙️</span><div>設定</div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div style="color:var(--primary-blue); font-weight:900; font-size:22px; text-align:center; margin-bottom:20px;">新增項目</div>
            <input type="date" class="input-field" id="datePicker">
            <select class="input-field" id="categoryPicker" onchange="checkCategory()">
                <option value="油費" data-icon="⛽">油費 ⛽</option>
                <option value="保養" data-icon="🛠️">保養 🛠️</option>
                <option value="車檢" data-icon="🔍">車檢 🔍</option>
                <option value="其他" data-icon="✨">其他 ✨</option>
            </select>
            <div id="extraNoteGroup"><input type="text" class="input-field" id="noteInput" placeholder="項目說明"></div>
            <input type="number" class="input-field" id="amountInput" placeholder="輸入金額" inputmode="numeric">
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button style="flex:1; height:50px; border-radius:15px; border:none; background:#F2F4F7; font-weight:900; color:#888;" onclick="toggleModal(false)">取消</button>
                <button style="flex:1; height:50px; border-radius:15px; border:none; background:var(--light-blue); color:var(--primary-blue); font-weight:900;" onclick="handleSave()">儲存</button>
            </div>
        </div>
    </div>

    <script>
        window.allRecords = [];

        function initDates() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('yearFilter').value = y;
            document.getElementById('monthFilter').value = m;
            document.getElementById('datePicker').valueAsDate = now;
            document.getElementById('banner-month').innerText = `${parseInt(m)}月總支出`;
        }

        function checkCategory() {
            const cat = document.getElementById('categoryPicker').value;
            document.getElementById('extraNoteGroup').style.display = cat !== "油費" ? "block" : "none";
        }

        function toggleModal(show) {
            document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
        }

        async function handleSave() {
            const dateVal = document.getElementById('datePicker').value;
            const catSelect = document.getElementById('categoryPicker');
            const amountVal = parseInt(document.getElementById('amountInput').value);
            if (!amountVal) return alert('請輸入金額！');
            
            const newRecord = {
                year: dateVal.split('-')[0],
                month: dateVal.split('-')[1],
                fullDate: dateVal,
                category: catSelect.value,
                note: document.getElementById('noteInput').value || "",
                icon: catSelect.options[catSelect.selectedIndex].getAttribute('data-icon'),
                amount: amountVal,
                createTime: Date.now()
            };
            await window.saveToCloud(newRecord);
            toggleModal(false);
            document.getElementById('amountInput').value = "";
            document.getElementById('noteInput').value = "";
        }

        async function deleteRecord(docId) {
            if(confirm('確定要刪除嗎？')) await window.deleteFromCloud(docId);
        }

        window.render = function() {
            const fYear = document.getElementById('yearFilter').value;
            const fMonth = document.getElementById('monthFilter').value;
            document.getElementById('banner-month').innerText = `${parseInt(fMonth)}月總支出`;

            const stats = { "油費": 0, "保養": 0, "車檢": 0, "其他": 0 };
            const icons = { "油費": "⛽", "保養": "🛠️", "車檢": "🔍", "其他": "✨" };
            let total = 0;

            const filtered = window.allRecords.filter(r => r.year === fYear && r.month === fMonth);
            filtered.forEach(r => {
                const amt = Number(r.amount) || 0;
                if(stats[r.category] !== undefined) stats[r.category] += amt;
                total += amt;
            });

            document.getElementById('total-display').innerText = `$ ${total.toLocaleString()}`;
            document.getElementById('statsGrid').innerHTML = Object.entries(stats).map(([name, val]) => `
                <div class="stats-item"><span>${icons[name]} ${name}</span><span>$${val.toLocaleString()}</span></div>
            `).join('');

            document.getElementById('history-list').innerHTML = filtered.length ? filtered.map(r => `
                <div class="record-card">
                    <div class="record-info">
                        <div class="record-icon">${r.icon}</div>
                        <div class="record-details">
                            <b>${r.category} ${r.note ? `<span style="color:#5D9CEC; font-size:14px;">(${r.note})</span>` : ''}</b>
                            <small>${r.fullDate}</small>
                        </div>
                    </div>
                    <div class="record-right">
                        <div class="record-amount">$ ${r.amount.toLocaleString()}</div>
                        <button class="delete-btn" onclick="deleteRecord('${r.docId}')">🗑️</button>
                    </div>
                </div>
            `).join('') : '<p style="text-align:center; color:#ccc; font-weight:700; margin-top:30px;">目前無紀錄</p>';
        }

        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') toggleModal(false);
        });

        initDates();
    </script>
</body>
</html>
